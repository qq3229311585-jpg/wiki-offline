<body><div class="mw-parser-output"><div class="shortdescription">English polymath (1642&#8211;1727)</div><p>Sir <b>Isaac Newton</b> was an English polymath active as a mathematician, physicist and astronomer. He formulated the laws of motion and universal gravitation used in <a href="./Physics">physics</a>.</p>
<div class="mw-heading mw-heading2"><h2 id="Legacy">Legacy</h2></div><p>Newton's work influenced <a href="./Albert_Einstein">Albert Einstein</a> and many later scientists.</p></div></body></html>
